name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for npm provenance — links the published tarball to this exact
  # commit and workflow run, so consumers can verify it matches public source.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run lint:ci
      - run: npm test -- --coverage
      - run: npm run build-production
      - run: npm run size
      - run: npm run check-manifest

      # The tag must match the version being published, or we would ship
      # something other than what the tag claims.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
