name: Feature request
description: Suggest a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing when you need this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the API to look like?
      description: A sketch is fine.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Two constraints worth knowing: the package has **zero runtime
        dependencies** and an enforced **bundle size budget**. Proposals that
        fit inside those, or that can ship behind a subpath export, are much
        more likely to land.
